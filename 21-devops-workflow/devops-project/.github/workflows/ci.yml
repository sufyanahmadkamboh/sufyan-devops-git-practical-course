name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        run: bash scripts/ci.sh
      - name: Lint the Helm chart
        run: helm lint helm/cafe
      - name: Build the image (not pushed)
        run: docker build -t cafe:ci .
