<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="06-reflog"><rect width="1000" height="330" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">The reflog: where HEAD has been</text><rect x="40" y="70" width="560" height="220" rx="10" fill="#7c3aed08" stroke="#7c3aed" stroke-width="2"/><text x="320.0" y="185.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve"></text><text x="70" y="115" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start" xml:space="preserve">HEAD@{0}</text><text x="190" y="115" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#dc2626" text-anchor="start" xml:space="preserve">reset: moving to HEAD~3</text><text x="70" y="151" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start" xml:space="preserve">HEAD@{1}</text><text x="190" y="151" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">commit: Price mocha</text><text x="70" y="187" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start" xml:space="preserve">HEAD@{2}</text><text x="190" y="187" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">commit: Add mocha</text><text x="70" y="223" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start" xml:space="preserve">HEAD@{3}</text><text x="190" y="223" font-family="