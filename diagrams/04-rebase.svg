<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="04-rebase"><rect width="1000" height="330" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Rebase: replay your commits on a new base</text><text x="30" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">before</text><circle cx="70" cy="180" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><text x="70" y="185" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">A</text><circle cx="150" cy="180" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><text x="150" y="185" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">B</text><line x1="87" y1="180" x2="133" y2="180" stroke="#c9d1dc" stroke-width="3"/><circle cx="240" cy="230" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><text x="240" y="235" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">D</text><line x1="165" y1="190" x2="224" y2="223" stroke="#c9d1dc" stroke-width="3"/><rect x="214.0" y="257" width="52" height="24" rx="12" fill="#2563eb"/><text x="240" y="274" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">main</text><circle cx="240" cy="130" r="17" fill="#ea7a0c" stroke="#ea7a0c" stroke-width="2.5"/><text x="240" y="135" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">C1</text><circle cx="320" cy="130" r="17" fill="#ea7a0c" stroke="#ea7a0c" stroke-width="2.5"/><text x="320" y="135" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">C2</text><line x1="165" y1="170" x2="224" y2="137" stroke="#ea7a0c" stroke-width="3"/><line x1="257" y1="130" x2="303" y2="130" stroke="#ea7a0c" stroke-width="3"/><rect x="280.5" y="82" width="79" height="24" rx="12" fill="#ea7a0c"/><text x="320" y="99" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">feature</text><defs><marker id="a21" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="380" y1="180" x2="450" y2="180" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a21)"/><text x="415.0" y="171.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">git rebase main</text><text x="500" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">after</text><circle cx="520" cy="180" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><text x="520" y="185" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">A</text><circle cx="600" cy="180" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><text x="600" y="185" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">B</text><circle cx="680" cy="180" r="17" fill="#2563eb" stroke="#2563eb" stroke-width="2.5"/><text x="680" y="185" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">D</text><line x1="537" y1="180" x2="583" y2="180" stroke="#c9d1dc" stroke-width="3"/><line x1="617" y1="180" x2="663" y2="180" stroke="#c9d1dc" stroke-width="3"/><circle cx="760" cy="180" r="17" fill="#ea7a0c" stroke="#ea7a0c" stroke-width="2.5"/><text x="760" y="185" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">C1'</text><circle cx="840" cy="180" r="17" fill="#ea7a0c" stroke="#ea7a0c" stroke-width="2.5"/><text x="840" y="185" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">C2'</text><line x1="697" y1="180" x2="743" y2="180" stroke="#ea7a0c" stroke-width="3"/><line x1="777" y1="180" x2="823" y2="180" stroke="#ea7a0c" stroke-width="3"/><rect x="654.0" y="212" width="52" height="24" rx="12" fill="#2563eb"/><text x="680" y="229" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">main</text><rect x="800.5" y="127" width="79" height="24" rx="12" fill="#ea7a0c"/><text x="840" y="144" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">feature</text><circle cx="760" cy="105" r="17" fill="#ffffff" stroke="#ea7a0c" stroke-width="2.5" stroke-dasharray="4 3"/><text x="760" y="110" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">C1</text><circle cx="840" cy="105" r="17" fill="#ffffff" stroke="#ea7a0c" stroke-width="2.5" stroke-dasharray="4 3"/><text x="840" y="110" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">C2</text><text x="900" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="end" xml:space="preserve">old commits: reflog only</text><text x="500" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#dc2626" text-anchor="middle" xml:space="preserve">C1' and C2' are new commits (new IDs). Never rebase commits others have built on.</text></svg>
