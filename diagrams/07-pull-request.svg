<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="07-pull-request"><rect width="1000" height="300" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">A pull request</text><rect x="20" y="110" width="170" height="80" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2"/><text x="105.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">Feature branch</text><text x="105.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">pushed</text><rect x="216" y="110" width="170" height="80" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="2"/><text x="301.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle" xml:space="preserve">Pull request</text><text x="301.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">branch vs main</text><defs><marker id="a8" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="190" y1="150" x2="214" y2="150" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a8)"/><rect x="412" y="110" width="170" height="80" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="497.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">Review</text><text x="497.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">comments, approval</text><defs><marker id="a13" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="386" y1="150" x2="410" y2="150" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a13)"/><rect x="608" y="110" width="170" height="80" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="693.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">Checks</text><text x="693.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">CI must be green</text><defs><marker id="a18" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="582" y1="150" x2="606" y2="150" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a18)"/><rect x="804" y="110" width="170" height="80" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="889.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">Merge</text><text x="889.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">into main</text><defs><marker id="a23" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="778" y1="150" x2="802" y2="150" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a23)"/><text x="500" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">Protected main: no direct pushes, required review and checks (lesson 59)</text></svg>
