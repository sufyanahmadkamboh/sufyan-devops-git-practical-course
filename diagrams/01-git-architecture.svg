<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="01-git-architecture"><rect width="1000" height="330" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Where your changes live</text><rect x="20" y="110" width="180" height="90" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2"/><text x="110.0" y="149.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">Working directory</text><text x="110.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">your files</text><rect x="270" y="110" width="180" height="90" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="360.0" y="149.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">Staging area</text><text x="360.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">the next commit</text><rect x="520" y="110" width="180" height="90" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="2"/><text x="610.0" y="149.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle" xml:space="preserve">Local repository</text><text x="610.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">.git: commits</text><rect x="770" y="110" width="180" height="90" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="860.0" y="149.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">Remote repository</text><text x="860.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">GitHub: origin</text><defs><marker id="a14" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="204" y1="140" x2="266" y2="140" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a14)"/><text x="235.0" y="131.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">add</text><defs><marker id="a17" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="454" y1="140" x2="516" y2="140" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a17)"/><text x="485.0" y="131.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">commit</text><defs><marker id="a20" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="704" y1="140" x2="766" y2="140" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a20)"/><text x="735.0" y="131.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">push</text><defs><marker id="a23" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="766" y1="175" x2="704" y2="175" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a23)"/><text x="735.0" y="195.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">fetch</text><defs><marker id="a26" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="266" y1="175" x2="204" y2="175" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a26)"/><text x="235.0" y="195.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">restore</text><text x="500" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">git status shows the first two columns · git log shows the third · git fetch updates origin/*</text><text x="500" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">git pull = fetch + merge (or rebase) · git switch moves the working directory to another commit</text></svg>
