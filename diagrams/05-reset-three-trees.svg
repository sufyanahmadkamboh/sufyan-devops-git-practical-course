<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="05-reset-three-trees"><rect width="1000" height="380" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">git reset: what each mode resets</text><text x="60" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve"></text><text x="290" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">HEAD / branch</text><text x="520" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">Staging area (index)</text><text x="750" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">Working directory</text><rect x="40" y="115" width="190" height="50" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="135.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">--soft</text><text x="290" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">moves</text><text x="520" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start" xml:space="preserve">kept</text><text x="750" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start" xml:space="preserve">kept</text><rect x="40" y="185" width="190" height="50" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2"/><text x="135.0" y="215.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">--mixed (default)</text><text x="290" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">moves</text><text x="520" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ea7a0c" text-anchor="start" xml:space="preserve">reset</text><text x="750" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start" xml:space="preserve">kept</text><rect x="40" y="255" width="190" height="50" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="2"/><text x="135.0" y="285.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">--hard</text><text x="290" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">moves</text><text x="520" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="start" xml:space="preserve">reset</text><text x="750" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="start" xml:space="preserve">reset (uncommitted work lost!)</text><text x="500" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">Commits left behind by reset are still recoverable with git reflog / ORIG_HEAD (lessons 33, 81).</text></svg>
