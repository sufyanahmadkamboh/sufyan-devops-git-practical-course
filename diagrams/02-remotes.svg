chor="middle" xml:space="preserve">origin/main</text><rect x="834.0" y="137" width="52" height="24" rx="12" fill="#16a34a"/><text x="860" y="154" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">main</text><text x="240" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">origin/main = main on the server at your last fetch</text><text x="240" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0d9488" text-anchor="middle" xml:space="preserve">git fetch brings D and moves origin/main</text><defs><marker id="a35" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><line x1="560" y1="222" x2="440" y2="222" stroke="#0d9488" stroke-width="2.2" marker-end="url(#a35)"/><text x="500.0" y="242.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#0d9488" text-anchor="middle" xml:space="preserve">git fetch</text><defs><marker id="a38" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><line x1="440" y1="160" x2="560" y2="160" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a38)"/><text x="500.0" y="151.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#2563eb" text-anchor="middle" xml:space="preserve">git push</text></svg>
